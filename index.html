<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{DESC}}"><meta property="og:type" content="website">
<meta name="theme-color" content="#090d1e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.theme||'midnight';d.dataset.mode=localStorage.mode||'dark'}catch(e){}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"EducationalOrganization","name":"LearnWithAI","url":"{{SITE}}"}</script>
<style>
:root{--bg:#090d1e;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.10);--text:#eef1ff;--mute:#a1abd3;--inp:rgba(255,255,255,.06);--a:#6366f1;--b:#22d3ee;--grad:linear-gradient(135deg,var(--a),var(--b));--font:'Plus Jakarta Sans',system-ui,sans-serif;--head:'Sora','Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
html[data-mode=light]{--bg:#f4f6fc;--card:#fff;--line:#e1e5f2;--text:#141a33;--mute:#5a6488;--inp:#f0f3fb}
html[data-theme=aurora]{--a:#10b981;--b:#84cc16}html[data-theme=sunset]{--a:#f97316;--b:#ec4899}html[data-theme=ocean]{--a:#0ea5e9;--b:#6366f1}
html[data-theme=royal]{--a:#a855f7;--b:#ec4899}html[data-theme=rose]{--a:#f43f5e;--b:#f59e0b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);line-height:1.7;background:radial-gradient(900px 500px at 8% -10%,color-mix(in srgb,var(--a) 26%,transparent),transparent),radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--b) 20%,transparent),transparent),var(--bg);background-attachment:fixed}
a{color:var(--b);text-decoration:none}h1,h2,h3,h4{font-family:var(--head);letter-spacing:-.02em;line-height:1.25}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--head);font-weight:800;font-size:21px;color:var(--text);margin-right:auto}.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px}nav a{color:var(--mute);padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px}nav a:hover{color:var(--text);background:var(--inp)}
.menu{display:none;background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:20px;padding:4px 12px;cursor:pointer}
.pal{display:none;position:absolute;right:16px;top:100%;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;gap:10px;align-items:center;box-shadow:0 20px 40px -10px #0008}.pal.open{display:flex}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.dot:hover{transform:scale(1.15)}
.wrap{max-width:1120px;margin:auto;padding:26px 18px 70px}
.hero{text-align:center;padding:50px 8px 26px}
.hero h1{font-size:clamp(32px,6vw,58px);margin:0 0 14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);max-width:660px;margin:auto auto 20px;font-size:clamp(16px,2.4vw,19px)}
h2.big{font-size:clamp(24px,4vw,36px);text-align:center;margin:0}
.pill{border:1px solid var(--line);background:var(--inp);border-radius:99px;padding:5px 14px;color:var(--mute);font-size:13px;font-weight:600;display:inline-block;margin:4px 4px 4px 0}
.btn{background:var(--grad);color:#fff;border:0;padding:11px 20px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;display:inline-block;box-shadow:0 10px 24px -10px var(--a);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.ghost{background:var(--inp);border:1px solid var(--line);color:var(--text);box-shadow:none}.btn.red{background:#dc2626;box-shadow:none}.btn:disabled{opacity:.6}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;background:var(--inp);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent)}
select option{background:var(--bg);color:var(--text)}input[type=checkbox]{width:auto;margin-right:8px}label{display:block;color:var(--mute);font-size:14px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;backdrop-filter:blur(10px);box-shadow:0 14px 34px -22px #000a}
.course{transition:.25s;margin:0}.course:hover{transform:translateY(-6px);border-color:var(--a);box-shadow:0 22px 40px -22px var(--a)}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--a) 18%,transparent);margin-bottom:6px}
.course h3{margin:8px 0 4px}.course p{color:var(--mute);margin:0 0 14px;font-size:14px}
.narrow{max-width:640px;margin:30px auto}.err{color:#f87171}.ok{color:#4ade80}
.notice{background:color-mix(in srgb,var(--a) 16%,transparent);border:1px solid color-mix(in srgb,var(--a) 50%,transparent);border-radius:14px;padding:11px 16px;margin:8px 0}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--inp);border:2px solid var(--line)}.av.big{width:110px;height:110px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hm{display:inline}
.founder{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:30px}
.ring{padding:5px;border-radius:50%;background:var(--grad);width:max-content}.ring img,.ring .av{display:block;width:160px;height:160px;border-radius:50%;object-fit:cover;border:5px solid var(--bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}.stat{text-align:center;margin:0}
.stat b{font-family:var(--head);font-size:38px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
.team .card{text-align:center;margin:0}.team img,.team .av{width:96px;height:96px;margin:auto}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.post{margin:0}.post img{width:100%;border-radius:14px;margin-bottom:10px}.post p,.pre{white-space:pre-wrap}.post small{color:var(--mute)}
ol.lessons{padding-left:22px}ol.lessons li{padding:9px 0;border-bottom:1px solid var(--line)}
.lesson h1,.lesson h2,.lesson h3{margin-top:28px}.lesson h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.lesson pre{background:#070b1a;color:#e6ebff;border:1px solid var(--line);padding:16px;border-radius:14px;overflow:auto;position:relative}
.lesson code{font-family:var(--mono);font-size:13.5px}.lesson :not(pre)>code{background:var(--inp);padding:2px 7px;border-radius:6px}
.lesson table{border-collapse:collapse;display:block;overflow:auto}.lesson td,.lesson th{border:1px solid var(--line);padding:6px 10px}
.copy{position:absolute;top:8px;right:8px;background:var(--a);color:#fff;border:0;border-radius:8px;padding:3px 11px;cursor:pointer;font-size:12px}
.loader{text-align:center;padding:60px;color:var(--mute)}
.spin{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--b);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
table.t{width:100%;border-collapse:collapse;display:block;overflow:auto}.t td,.t th{border-bottom:1px solid var(--line);padding:8px;text-align:left;font-size:14px}
footer{text-align:center;color:var(--mute);padding:30px;border-top:1px solid var(--line)}
.legal h3{margin-top:24px}.legal li{margin:4px 0}.danger{border-color:#7f1d1d}
.toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 28px))}
.toast{background:var(--grad);color:#fff;padding:13px 18px;border-radius:14px;cursor:pointer;font-weight:600;box-shadow:0 14px 34px -10px #000a;animation:up .35s}@keyframes up{from{transform:translateY(20px);opacity:0}}
@media(max-width:820px){.menu{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);flex-direction:column;padding:10px 16px;border-bottom:1px solid var(--line)}nav.open{display:flex}.hm{display:none}
 .founder,.grid2,.two{grid-template-columns:1fr}.founder{text-align:center;justify-items:center}.card{padding:18px}.pal{right:8px}}
.sheet{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:14px;padding:34px;border-radius:6px;max-width:800px;margin:12px auto;box-shadow:0 12px 30px -14px #000}
.sheet div{padding:1px 4px;outline:0}.sheet div:focus{background:#eef3ff}.sheet [data-k=name]{font-size:24px;font-weight:700}.sheet [data-k=contact]{font-size:12px;color:#444}
.sheet [data-k=head]{font-weight:700;border-bottom:1px solid #111;margin-top:12px}.sheet [data-k=line]{font-weight:700;margin-top:6px}.sheet [data-k=bullet]{margin-left:20px;display:list-item;list-style:disc}
.policybox{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--inp);font-size:14px;margin:10px 0}.policybox h2{font-size:18px;margin-top:0}.policybox h3{font-size:15px;margin:14px 0 4px}
.video{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;margin:14px 0;background:#000}.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}.hint{color:var(--mute);font-size:13px}
@media print{body *{visibility:hidden}#out,#out *{visibility:visible}#out{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;padding:20px}#out *{color:#000!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="/" data-link>Learn<span>With</span>AI</a>
  <nav id="nav"><a href="/" data-link>Courses</a><a href="/feed" data-link>Updates</a><a href="/career" data-link>Career Tools</a><a href="/about" data-link>About</a><a href="/contact" data-link>Contact</a><a href="/privacy" data-link>Privacy</a></nav>
  <span id="auth" class="row"></span><button class="menu" id="thm" aria-label="Themes" style="display:block">🎨</button><button class="menu" id="mb" aria-label="Menu">☰</button>
</div><div id="pal" class="pal"></div></header>
<div class="wrap" id="app"></div>
<div class="toasts" id="toasts"></div>
<footer>&copy; LearnWithAI &middot; <a href="/privacy" data-link>Privacy &amp; Terms</a> &middot; <a href="/contact" data-link>Grievance / Contact</a></footer>

<script>
const app = document.getElementById('app'), $ = id => document.getElementById(id);
let user = null, photoData = null;
const ICONS = {'spring-boot':'🍃','spring-ai':'🤖','mcp':'🔌','fastmcp':'⚡','python':'🐍','python-data-science':'📊','realtime-data':'📡','postgresql':'🐘','neo4j':'🕸️','linux-devops':'🐧','aws-cli':'☁️'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method='GET', body){
  const r = await fetch('/api' + path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}
function go(p){ history.pushState({}, '', p); route(); window.scrollTo(0,0); }
document.addEventListener('click', e => { const a = e.target.closest('a[data-link]'); if(a){ e.preventDefault(); $('nav').classList.remove('open'); go(a.getAttribute('href')); }});
window.onpopstate = route;
const loading = m => app.innerHTML = `<div class="loader"><div class="spin"></div>${esc(m)}</div>`;
const setTitle = (t, d) => { document.title = t + ' | LearnWithAI'; if(d) document.querySelector('meta[name=description]').content = d; };
const needLogin = () => app.innerHTML = '<div class="card narrow">Please <a href="/login" data-link>log in</a> or <a href="/signup" data-link>sign up</a> to use this page.</div>';
const avatar = (u, cls='') => u.has_photo ? `<img class="av ${cls}" src="/api/photo/${u.id}?v=${Date.now()}" alt="profile photo">` : `<div class="av ${cls}" style="display:grid;place-items:center">👤</div>`;

function renderAuth(){
  $('auth').innerHTML = user
    ? `${user.role==='admin' ? '<a href="/admin" data-link>Admin</a>' : ''}<a href="/profile" data-link class="row">${avatar(user)} <span class="hm">My profile</span></a><button class="btn ghost" id="lo">Logout</button>`
    : `<a class="btn ghost" href="/login" data-link>Login</a><a class="btn" href="/signup" data-link>Sign up free</a>`;
  if($('lo')) $('lo').onclick = async () => { await api('/logout','POST'); user = null; renderAuth(); go('/'); };
}

async function route(){
  const p = location.pathname; let m;
  try{
    if(p === '/') return await home();
    if(p === '/login' || p === '/signup') return authView(p.slice(1));
    if(p === '/about') return await aboutView();
    if(p === '/feed') return await feedView();
    if(p === '/contact') return contactView();
    if(p === '/privacy') return privacyView();
    if(p === '/profile') return profileView();
    if(p === '/career') return careerView();
    if(p === '/admin') return await adminView();
    if(m = p.match(/^\/course\/([^/]+)$/)) return await courseView(m[1]);
    if(m = p.match(/^\/lesson\/([^/]+)\/(\d+)$/)) return await lessonView(m[1], +m[2]);
    app.innerHTML = '<div class="card">Page not found. <a href="/" data-link>Go home</a></div>';
  }catch(e){ app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

async function home(){
  setTitle('Learn Spring Boot, Python, AWS, DevOps with AI', 'AI-driven step-by-step courses, resume builder and ATS profile optimizer.');
  loading('Loading...');
  const [{courses}, {notices}, f] = await Promise.all([api('/courses'), api('/notices'), api('/founder').catch(() => null)]);
  app.innerHTML = `${notices.map(n => `<div class="notice">📢 ${esc(n.text)}</div>`).join('')}
    <section class="hero"><h1>Learn to build. Step by step. With AI.</h1>
    <p>Pick a course. Get installation, folder structure, full copy-paste code and a line-by-line explanation. Then build your ATS-ready resume.</p>
    <span class="pill">1. Sign up</span><span class="pill">2. Pick a course</span><span class="pill">3. AI writes your lesson</span><span class="pill">4. Copy, run, learn</span><br>
    ${user ? '' : '<a class="btn" href="/signup" data-link style="margin-top:14px">Start learning free</a>'}</section>
    <input id="q" placeholder="Search courses (spring, aws, python...)" style="max-width:420px;display:block;margin:0 auto 20px">
    <div class="grid" id="grid"></div>
    ${f ? `<div class="card row" style="margin-top:34px">${f.has_photo ? '<img class="av big" src="/api/founder-photo" alt="Founder">' : '<div class="av big" style="display:grid;place-items:center">👨‍💻</div>'}
      <div><div style="color:var(--mute)">Created by</div><h3 style="margin:0">${esc(f.name)}</h3><div style="color:var(--mute)">${esc(f.degree)}</div>
      <a href="${esc(f.linkedin)}" target="_blank" rel="noopener">Connect on LinkedIn &rarr;</a> &middot; <a href="/about" data-link>About us</a></div></div>` : ''}`;
  const draw = t => $('grid').innerHTML = courses.filter(c => (c.title+c.desc).toLowerCase().includes(t.toLowerCase()))
    .map(c => `<div class="card course"><div class="ico">${ICONS[c.slug]||'📘'}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p>
      <a class="btn" href="/course/${esc(c.slug)}" data-link>Open course</a></div>`).join('') || '<p>No course found.</p>';
  draw(''); $('q').oninput = e => draw(e.target.value);
}

async function courseView(slug){
  loading('Preparing your syllabus with AI (first time takes ~10 seconds)...');
  const d = await api('/course/' + slug), c = d.course;
  setTitle(c.title + ' Course', c.desc);
  app.innerHTML = `<div class="card"><div class="ico">${ICONS[c.slug]||'📘'}</div><h1>${esc(c.title)}</h1><p>${esc(c.desc)}</p>
    <p>Lessons are built from the official documentation: <a href="${esc(c.docs)}" target="_blank" rel="noopener">${esc(c.docs)}</a></p></div>${videoHTML(c.video)}
    ${d.locked ? `<div class="card"><h3>🔒 AI lessons are for registered learners</h3><p>Create a free account to unlock the full syllabus and lessons.</p>
      <a class="btn" href="/signup" data-link>Sign up free</a> <a class="btn ghost" href="/login" data-link>Login</a></div>`
    : `<div class="card"><h3>Lessons</h3><ol class="lessons">${d.lessons.map((l,i) => `<li><a href="/lesson/${esc(c.slug)}/${i}" data-link>${esc(l)}</a></li>`).join('')}</ol></div>`}`;
}

async function lessonView(slug, n){
  if(!user) return needLogin();
  loading('AI is writing your lesson (first learner only; after that it loads instantly)...');
  const d = await api(`/lesson/${slug}/${n}`);
  setTitle(d.title + ' - ' + d.course.title, 'Step by step: ' + d.title);
  app.innerHTML = `<p><a href="/course/${esc(slug)}" data-link>&larr; ${esc(d.course.title)}</a></p>
    <h1>${n+1}. ${esc(d.title)}</h1>${d.personal ? '<span class="pill">✨ Personalised for you</span> <button class="btn ghost" id="rs">Back to standard lesson</button>' : ''}
    <div class="card lesson" id="les">${d.html}</div>
    <div class="row">${n>0 ? `<a class="btn ghost" href="/lesson/${slug}/${n-1}" data-link>&larr; Previous</a>`:''}
    ${n<d.total-1 ? `<a class="btn" href="/lesson/${slug}/${n+1}" data-link>Next lesson &rarr;</a>`:''}</div>
    <div class="card"><h3>🙋 Stuck? Ask the AI tutor</h3>
    <textarea id="q" rows="3" placeholder="Describe what you did not understand..."></textarea>
    <div class="row"><button class="btn" id="ask">Ask (quick answer)</button><button class="btn ghost" id="upd">Rewrite this lesson for me</button></div>
    <div id="ans" class="lesson" style="margin-top:14px"></div></div>`;
  copyBtns($('les'));
  if($('rs')) $('rs').onclick = async () => { await api('/lesson/reset','POST',{slug,n}); lessonView(slug,n); };
  const send = update => async () => {
    const q = $('q').value.trim(); if(!q) return;
    $('ans').innerHTML = 'Thinking...';
    try{ const r = await api('/ask','POST',{slug, n, q: d.title + ': ' + q, update});
      if(update) return lessonView(slug, n); $('ans').innerHTML = r.html; copyBtns($('ans')); }
    catch(e){ $('ans').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  $('ask').onclick = send(false); $('upd').onclick = send(true);
}
function copyBtns(root){
  root.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copy';
    b.onclick = () => { navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText); b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy', 1500); };
    pre.appendChild(b);
  });
}

/* ---------- profile form (used by signup and profile page) ---------- */
function pform(p = {}){
  return `<div class="two"><input id="fn" placeholder="First name *" value="${esc(p.first_name)}"><input id="ln" placeholder="Last name *" value="${esc(p.last_name)}"></div>
    <label>Date of birth * (18+ only)</label><input id="dob" type="date" value="${esc(p.dob)}">
    <input id="dg" placeholder="Degree / qualification * (e.g. B.E. Computer Science)" value="${esc(p.degree)}">
    <select id="st"><option>Learner</option><option>Employed</option></select>
    <input id="co" placeholder="Company you work at *" value="${esc(p.company)}">
    <input id="li" placeholder="LinkedIn profile link * (https://www.linkedin.com/in/...)" value="${esc(p.linkedin)}">
    <label>Profile photo (optional, saved inside the database as encoded text)</label><input id="ph" type="file" accept="image/*">`;
}
function pinit(p = {}){
  photoData = null; $('st').value = p.status || 'Learner';
  const t = () => $('co').style.display = $('st').value === 'Employed' ? '' : 'none'; $('st').onchange = t; t();
  $('ph').onchange = e => { const f = e.target.files[0]; if(!f) return; const img = new Image();
    img.onload = () => { const s = Math.min(1, 320 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); photoData = c.toDataURL('image/jpeg', .8); };
    img.src = URL.createObjectURL(f); };
}
const pread = () => ({first_name:$('fn').value, last_name:$('ln').value, dob:$('dob').value, degree:$('dg').value, status:$('st').value, company:$('co').value, linkedin:$('li').value, photo:photoData});

function authView(mode){
  if(user) return go('/');
  setTitle(mode === 'login' ? 'Login' : 'Sign up');
  if(mode === 'login'){
    app.innerHTML = `<div class="card narrow"><h2>Welcome back</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password">
      <p class="err" id="m"></p><button class="btn" id="go">Login</button></div>`;

function toast(msg, link){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  t.onclick = () => { t.remove(); if(link) go(link); }; $('toasts').appendChild(t); setTimeout(() => t.remove(), 8000);

async function pollEvents(){      // checks for new courses / posts / announcements every 20 seconds (works on Vercel)
  try{ const r = await api('/events' + (lastEv ? '?since=' + encodeURIComponent(lastEv) : ''));
    r.events.forEach(m => toast(m.type === 'course' ? '🎓 New course: ' + m.title : m.type === 'post' ? '📸 New post: ' + m.title : '📢 ' + m.text, m.link));
    if(r.events.length && ['/', '/feed'].includes(location.pathname)) route(); lastEv = r.now; }catch(e){}
  setTimeout(pollEvents, 20000);

function shrink(file, max, cb){
  const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .82)); };
  img.src = URL.createObjectURL(file);
}

    <div class="card"><h3>Team members</h3>${tm.team.map(t => `<p>${esc(t.name)} &mdash; ${esc(t.role)} <button class="btn red" data-dt="${esc(t.id)}">x</button></p>`).join('') || '<p>No team members yet.</p>'}
      <div class="two"><input id="tn" placeholder="Name"><input id="tr2" placeholder="Role"></div><input id="tl" placeholder="Link (LinkedIn / Instagram, optional)">
      <label>Photo (optional)</label><input id="tp" type="file" accept="image/*"><button class="btn" id="tm_add">Add team member</button></div>
    <div class="card"><h3>Posts, images and memories</h3>${ps.posts.map(p => `<p>${esc(p.title)} <small>(${p.public ? 'public' : 'members'})</small> <button class="btn red" data-dp="${esc(p.id)}">x</button></p>`).join('') || '<p>No posts yet.</p>'}
      <input id="pt" placeholder="Title"><textarea id="px" rows="3" placeholder="Write your post..."></textarea><label>Image (optional)</label><input id="pi" type="file" accept="image/*"><input id="pv" placeholder="Video link (YouTube / Vimeo / .mp4, optional)"><label>Links (one per line: Title | https://link)</label><textarea id="pl" rows="2"></textarea><label>Attachments (up to 3 files, 2.5 MB in total)</label><input id="pf" type="file" multiple>
      <label><input type="checkbox" id="pp2"> Visible to the public (untick = members only)</label><button class="btn" id="po_add">Publish post (everyone online gets notified)</button></div>
    <div class="card"><h3>Messages (${d.messages.length})</h3>${d.messages.map(m => `<p><b>${esc(m.name)}</b> (${esc(m.email)}) <small>${esc(m.at)}</small><br>${esc(m.message)}</p><hr style="border-color:var(--line)">`).join('') || 'No messages yet.'}</div>`;
  $('t').onclick = async () => { const r = $('tr'); r.textContent = 'Testing...'; try{ r.className='ok'; r.textContent = (await api('/admin/test-ai')).reply; }catch(e){ r.className='err'; r.textContent = e.message; } };
  let tPh = null, pImg = null;
  $('tp').onchange = e => e.target.files[0] && shrink(e.target.files[0], 300, r => tPh = r);
  $('pi').onchange = e => e.target.files[0] && shrink(e.target.files[0], 1100, r => pImg = r);
  $('ab_sv').onclick = async () => { try{ await api('/admin/about','PUT',{tagline:$('ab_t').value, story:$('ab_s').value, mission:$('ab_m').value, founder_bio:$('ab_b').value, video:$('ab_v').value, highlights:$('ab_h').value, commitments:$('ab_c').value, socials:$('ab_so').value}); $('ab_m2').textContent = 'Saved!'; }catch(e){ $('ab_m2').textContent = e.message; } };
  $('tm_add').onclick = async () => { try{ await api('/admin/team','POST',{name:$('tn').value, role:$('tr2').value, link:$('tl').value, photo:tPh}); adminView(); }catch(e){ alert(e.message); } };
  $('po_add').onclick = async () => { try{ await api('/admin/post','POST',{title:$('pt').value, text:$('px').value, image:pImg, public:$('pp2').checked, video:$('pv').value, links:$('pl').value, files: await readFiles($('pf'))}); adminView(); }catch(e){ alert(e.message); } };
  app.querySelectorAll('[data-dt]').forEach(b => b.onclick = async () => { await api('/admin/team/' + b.dataset.dt,'DELETE'); adminView(); });
  app.querySelectorAll('[data-dp]').forEach(b => b.onclick = async () => { if(confirm('Delete this post?')){ await api('/admin/post/' + b.dataset.dp,'DELETE'); adminView(); }});
  app.querySelectorAll('[data-vu]').forEach(a => a.onclick = e => { e.preventDefault();
    const u = d.users.find(x => x.email === a.dataset.vu), ed = $('ed'); ed.style.display = '';
    const rows = {Email:u.email, Role:u.role, 'Date of birth':u.dob, Degree:u.degree, Status:u.status, Company:u.company, LinkedIn:u.linkedin, Notifications:u.notify ? 'yes' : 'no',
      'Consent version':u.consent, Joined:u.created, 'Last login':u.last_login, 'AI calls (total)':u.ai_calls, 'Personal lessons':u.personal_lessons};
    ed.innerHTML = `<h3>${esc(u.first_name)} ${esc(u.last_name)}</h3>${u.has_photo ? `<img class="av big" src="/api/photo/${u.id}" alt="photo">` : ''}<table class="t">${Object.entries(rows).map(([k,v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</table>`;
    ed.scrollIntoView({behavior:'smooth'}); });
  $('na').onclick = async () => { await api('/admin/notice','POST',{text:$('nt').value}); adminView(); };
  $('ca').onclick = async () => { await api('/admin/course','POST',{title:$('ct').value, desc:$('cd').value, docs:$('cu').value, video:$('cv').value}); adminView(); };
  app.querySelectorAll('[data-nd]').forEach(b => b.onclick = async () => { await api('/admin/notice/' + b.dataset.nd,'DELETE'); adminView(); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if(confirm('Delete course?')){ await api('/admin/course/' + b.dataset.del,'DELETE'); adminView(); }});
  app.querySelectorAll('[data-du]').forEach(b => b.onclick = async () => { if(confirm('Delete this user permanently?')){ try{ await api('/admin/user/' + encodeURIComponent(b.dataset.du),'DELETE'); adminView(); }catch(e){ alert(e.message); } }});
  $('au').onclick = async () => { try{ await api('/admin/user','POST',{email:$('ae').value, password:$('ap').value, first_name:$('af').value, last_name:$('al').value, role:$('ar')?.value}); adminView(); }catch(e){ $('am').textContent = e.message; } };
  app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => {
    const u = d.users.find(x => x.email === b.dataset.eu), ed = $('ed'); ed.style.display = '';
    ed.innerHTML = `<h3>Edit ${esc(u.email)}</h3>${pform(u)}${user.super && !u.super ? '<label>Role</label><select id="rl"><option value="user">user</option><option value="admin">admin (sudo)</option></select>' : ''}
      <input id="npw" type="password" placeholder="New password (leave empty to keep the old one)"><p id="em" class="err"></p><button class="btn" id="es">Save changes</button>`;
    pinit(u); if($('rl')) $('rl').value = u.role; ed.scrollIntoView();
    $('es').onclick = async () => { try{ await api('/admin/user/' + encodeURIComponent(u.email),'PUT',{...pread(), role:$('rl')?.value, password:$('npw').value}); adminView(); }catch(e){ $('em').textContent = e.message; } };
  });
  app.querySelectorAll('[data-ec]').forEach(b => b.onclick = async () => { const c = d.courses.find(x => x.slug === b.dataset.ec);
    const title = prompt('Course title', c.title); if(title === null) return; const desc = prompt('Short description', c.desc); if(desc === null) return;
    const docs = prompt('Official docs URL', c.docs); if(docs === null) return; const video = prompt('Intro video link (YouTube / Vimeo / .mp4, empty = none)', c.video || ''); if(video === null) return; await api('/admin/course/' + c.slug,'PUT',{title, desc, docs, video}); adminView(); });
  app.querySelectorAll('[data-clear]').forEach(b => b.onclick = async () => { await api('/admin/clear/' + b.dataset.clear,'POST'); b.textContent = 'Cleared!'; });
}

(async () => { try{ user = (await api('/me')).user; }catch(e){} buildPal(); renderAuth(); route(); pollEvents(); })();
</script>
</body>
</html>
